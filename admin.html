<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="robots" content="noindex, nofollow">
	<meta name="theme-color" content="#102A4C">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Agenda Goizueta">
	<link rel="icon" type="image/png" href="./assets/logg.png">
	<link rel="apple-touch-icon" href="./assets/logg.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;800;900&family=Red+Hat+Text:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/normalize.css">
	<link rel="stylesheet" href="css/admin.css">
	<title>Agenda | Clínica Dr. Goizueta</title>
</head>
<body>
	<svg width="0" height="0" style="position:absolute" aria-hidden="true">
		<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
		<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
		<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5.5 5.5 0 0 1 3.5 6"/></symbol>
		<symbol id="i-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></symbol>
		<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
		<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
		<symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
		<symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
		<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
		<symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
		<symbol id="i-wa" viewBox="0 0 24 24"><path d="M3 21l1.6-5A8.5 8.5 0 1 1 8 19.5z"/></symbol>
		<symbol id="i-sms" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
		<symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></symbol>
		<symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 3h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></symbol>
		<symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h6"/></symbol>
		<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
		<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
		<symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
	</svg>

	<!-- SIGN IN -->
	<main class="login" id="loginView" hidden>
		<form class="login__card" id="loginForm">
			<img src="./assets/logg.png" alt="" width="84" height="72">
			<h1>Agenda de la clínica</h1>
			<p class="muted">Dr. Goizueta, El Cubano</p>
			<label class="fld"><span>Correo</span><input id="l-email" type="email" autocomplete="username" required></label>
			<label class="fld"><span>Contraseña</span><input id="l-pass" type="password" autocomplete="current-password" required></label>
			<button class="btn btn--primary btn--block" type="submit">Entrar</button>
			<button class="linkbtn" type="button" id="forgot">¿Olvidó su contraseña?</button>
			<p class="login__msg" id="loginMsg" role="alert"></p>
		</form>
	</main>

	<!-- APP -->
	<div class="app" id="appView" hidden>
		<aside class="side">
			<a class="side__brand" href="index.html" title="Ver la web pública">
				<img src="./assets/logg.png" alt="" width="52" height="45">
				<span><strong>Dr. Goizueta</strong><small>Agenda</small></span>
			</a>
			<nav class="side__nav" aria-label="Secciones">
				<button data-view="dash" aria-current="page"><svg class="ic"><use href="#i-home"/></svg><span>Resumen</span></button>
				<button data-view="cal"><svg class="ic"><use href="#i-cal"/></svg><span>Calendario</span><b class="badge" id="navBadge" hidden></b></button>
				<button data-view="patients"><svg class="ic"><use href="#i-users"/></svg><span>Pacientes</span></button>
				<button data-view="payments"><svg class="ic"><use href="#i-cash"/></svg><span>Pagos</span></button>
				<button data-view="settings"><svg class="ic"><use href="#i-gear"/></svg><span>Ajustes</span></button>
			</nav>
			<div class="mini" id="mini"></div>
			<div class="side__foot">
				<span class="side__user" id="who"></span>
				<button class="iconbtn" id="logout" title="Cerrar sesión" aria-label="Cerrar sesión"><svg class="ic"><use href="#i-out"/></svg></button>
			</div>
		</aside>

		<div class="main">
			<header class="top">
				<div class="top__title">
					<h1 id="viewTitle">Resumen</h1>
					<p id="viewSub" class="muted"></p>
				</div>
				<div class="top__tools" id="topTools"></div>
				<button class="btn btn--primary" id="newBtn"><svg class="ic"><use href="#i-plus"/></svg><span>Nueva cita</span></button>
			</header>
			<div class="banner" id="banner" role="alert" hidden></div>
			<section class="view" id="view" aria-live="polite"></section>
		</div>
	</div>

	<!-- APPOINTMENT DETAIL -->
	<div class="scrim" id="scrim" hidden></div>
	<aside class="drawer" id="drawer" aria-labelledby="dTitle" hidden>
		<div class="drawer__head">
			<div><h2 id="dTitle"></h2><p class="muted" id="dWhen"></p></div>
			<button class="iconbtn" id="dClose" aria-label="Cerrar"><svg class="ic"><use href="#i-x"/></svg></button>
		</div>
		<div class="drawer__body" id="dBody"></div>
	</aside>

	<!-- NEW APPOINTMENT -->
	<dialog class="dlg" id="newDlg">
		<form id="newForm">
			<div class="dlg__head"><h2>Nueva cita</h2><button class="iconbtn" type="button" data-close aria-label="Cerrar"><svg class="ic"><use href="#i-x"/></svg></button></div>
			<div class="grid2">
				<label class="fld"><span>Fecha</span><input id="n-date" type="date" required></label>
				<label class="fld"><span>Hora</span><select id="n-time" required></select></label>
			</div>
			<label class="fld"><span>Nombre del paciente</span><input id="n-name" required minlength="3" maxlength="80" list="patientList" autocomplete="off"></label>
			<datalist id="patientList"></datalist>
			<div class="grid2">
				<label class="fld"><span>Teléfono / WhatsApp</span><input id="n-phone" type="tel" required maxlength="25"></label>
				<label class="fld"><span>Correo (opcional)</span><input id="n-email" type="email" maxlength="100"></label>
			</div>
			<label class="fld"><span>Servicio</span>
				<select id="n-service">
					<option>Consulta general</option><option>Medicina familiar</option><option>Control de enfermedades crónicas</option>
					<option>Curaciones y procedimientos menores</option><option>Inyectables y signos vitales</option>
					<option>Dictámenes y certificados</option><option>Teleconsulta</option><option>Visita a domicilio</option>
				</select></label>
			<label class="fld"><span>Nota (opcional)</span><textarea id="n-note" rows="2" maxlength="400"></textarea></label>
			<label class="chk"><input type="checkbox" id="n-notify" checked> <span>Enviar confirmación al paciente</span></label>
			<div class="dlg__acts">
				<button class="btn btn--ghost" type="button" data-close>Cancelar</button>
				<button class="btn btn--primary" type="submit">Agendar cita</button>
			</div>
		</form>
	</dialog>

	<!-- PAYMENT -->
	<dialog class="dlg" id="payDlg">
		<form id="payForm">
			<div class="dlg__head"><h2>Registrar pago</h2><button class="iconbtn" type="button" data-close aria-label="Cerrar"><svg class="ic"><use href="#i-x"/></svg></button></div>
			<p class="muted" id="payWho"></p>
			<div class="grid2">
				<label class="fld"><span>Monto</span><input id="p-amount" type="number" inputmode="decimal" min="0" step="0.01" required></label>
				<label class="fld"><span>Moneda</span><select id="p-currency"><option value="CRC">Colones (₡)</option><option value="USD">Dólares (US$)</option></select></label>
			</div>
			<label class="fld"><span>Forma de pago</span>
				<select id="p-method"><option>SINPE Móvil</option><option>Tarjeta</option><option>Efectivo</option><option>Transferencia</option><option>Seguro</option></select></label>
			<label class="fld"><span>Referencia (opcional)</span><input id="p-ref" maxlength="60" placeholder="N.º de comprobante SINPE, voucher…"></label>
			<label class="chk"><input type="checkbox" id="p-send" checked> <span>Enviar el comprobante al paciente</span></label>
			<div class="dlg__acts">
				<button class="btn btn--ghost" type="button" data-close>Cancelar</button>
				<button class="btn btn--primary" type="submit">Guardar pago</button>
			</div>
		</form>
	</dialog>

	<div class="toasts" id="toasts" aria-live="polite"></div>

	<script src="js/config.js"></script>
	<script type="module" src="js/admin.js"></script>
</body>
</html>
